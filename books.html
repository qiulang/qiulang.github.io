<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的阅读书单 | My Reading List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1a1a2e;
            --secondary: #16213e;
            --accent: #e94560;
            --gold: #c9a227;
            --paper: #f5f0e8;
            --text: #2c2c2c;
            --text-light: #666;
            --shadow: rgba(0,0,0,0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Serif SC', 'Playfair Display', Georgia, serif;
            background: var(--paper);
            color: var(--text);
            line-height: 1.8;
            min-height: 100vh;
        }

        /* Hero Section */
        .hero {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            padding: 80px 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            opacity: 0.5;
        }

        .hero-content {
            position: relative;
            z-index: 1;
            max-width: 800px;
            margin: 0 auto;
        }

        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .hero h1 span {
            color: var(--gold);
        }

        .hero p {
            font-size: 1.2rem;
            color: rgba(255,255,255,0.8);
            max-width: 600px;
            margin: 0 auto;
        }

        .hero .stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 40px;
        }

        .hero .stat {
            text-align: center;
        }

        .hero .stat-number {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--gold);
        }

        .hero .stat-label {
            font-size: 0.9rem;
            color: rgba(255,255,255,0.6);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Filter Section */
        .filter-section {
            background: #fff;
            padding: 30px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 20px var(--shadow);
        }

        .filter-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            justify-content: center;
        }

        .filter-btn {
            padding: 10px 24px;
            border: 2px solid var(--primary);
            background: transparent;
            color: var(--primary);
            font-family: 'Noto Serif SC', serif;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 30px;
        }

        .filter-btn:hover, .filter-btn.active {
            background: var(--primary);
            color: #fff;
        }

        .search-box {
            position: relative;
            flex: 1;
            max-width: 300px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 20px;
            padding-left: 45px;
            border: 2px solid #ddd;
            border-radius: 30px;
            font-family: 'Noto Serif SC', serif;
            font-size: 0.95rem;
            transition: border-color 0.3s;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .search-box::before {
            content: '🔍';
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1rem;
        }

        /* Books Grid */
        .books-section {
            max-width: 1400px;
            margin: 0 auto;
            padding: 60px 20px;
        }

        .year-section {
            margin-bottom: 60px;
        }

        .year-title {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            color: var(--primary);
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 3px solid var(--gold);
            display: inline-block;
        }

        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }

        /* Book Card */
        .book-card {
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px var(--shadow);
            transition: all 0.4s ease;
            cursor: pointer;
        }

        .book-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.2);
        }

        .book-cover {
            position: relative;
            height: 220px;
            background: linear-gradient(145deg, var(--primary) 0%, var(--secondary) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .book-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .book-cover .placeholder {
            text-align: center;
            color: rgba(255,255,255,0.9);
            padding: 20px;
        }

        .book-cover .placeholder .icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .book-cover .placeholder .title {
            font-size: 1rem;
            font-weight: 600;
            line-height: 1.4;
        }

        .book-info {
            padding: 20px;
        }

        .book-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 8px;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .book-title-en {
            font-size: 0.85rem;
            color: var(--text-light);
            margin-bottom: 10px;
            font-style: italic;
        }

        .book-description {
            font-size: 0.9rem;
            color: var(--text-light);
            line-height: 1.6;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .book-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }

        .book-category {
            font-size: 0.75rem;
            padding: 4px 12px;
            background: var(--paper);
            color: var(--primary);
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .book-rating {
            color: var(--gold);
            font-size: 0.9rem;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            overflow-y: auto;
            padding: 40px 20px;
        }

        .modal.active {
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }

        .modal-content {
            background: #fff;
            max-width: 800px;
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            animation: slideUp 0.4s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border: none;
            background: rgba(0,0,0,0.5);
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: background 0.3s;
        }

        .modal-close:hover {
            background: var(--accent);
        }

        .modal-cover {
            width: 100%;
            height: 300px;
            background: linear-gradient(145deg, var(--primary) 0%, var(--secondary) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .modal-cover .placeholder {
            color: rgba(255,255,255,0.9);
            text-align: center;
            padding: 20px;
        }

        .modal-cover .placeholder .icon {
            font-size: 4rem;
        }

        .modal-body {
            padding: 40px;
        }

        .modal-title {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .modal-title-en {
            font-size: 1.1rem;
            color: var(--text-light);
            margin-bottom: 20px;
            font-style: italic;
        }

        .modal-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 25px;
        }

        .modal-tag {
            padding: 6px 16px;
            background: var(--paper);
            color: var(--primary);
            border-radius: 20px;
            font-size: 0.85rem;
        }

        .modal-description {
            font-size: 1rem;
            line-height: 1.9;
            color: var(--text);
        }

        .modal-notes {
            margin-top: 30px;
            padding: 20px;
            background: var(--paper);
            border-radius: 8px;
            border-left: 4px solid var(--gold);
        }

        .modal-notes h4 {
            color: var(--primary);
            margin-bottom: 10px;
            font-size: 1rem;
        }

        .modal-notes p {
            font-size: 0.95rem;
            color: var(--text-light);
        }

        /* Footer */
        .footer {
            background: var(--primary);
            color: rgba(255,255,255,0.7);
            text-align: center;
            padding: 40px 20px;
            margin-top: 60px;
        }

        .footer p {
            font-size: 0.9rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2.2rem;
            }

            .hero .stats {
                flex-direction: column;
                gap: 20px;
            }

            .books-grid {
                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            }

            .filter-container {
                flex-direction: column;
            }

            .search-box {
                max-width: 100%;
                width: 100%;
            }

            .modal-body {
                padding: 25px;
            }

            .modal-title {
                font-size: 1.5rem;
            }
        }

        /* Animations */
        .book-card {
            opacity: 0;
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .year-section {
            opacity: 0;
            animation: fadeIn 0.6s ease forwards;
        }
    </style>
</head>

        // Render books by year
        function renderBooks(books) {
            const container = document.getElementById('booksContainer');
            container.innerHTML = '';

            // Group by year
            const grouped = {};
            books.forEach(book => {
                if (!grouped[book.year]) grouped[book.year] = [];
                grouped[book.year].push(book);
            });

            // Sort years in descending order
            const years = Object.keys(grouped).sort((a, b) => b - a);

            years.forEach((year, index) => {
                const yearSection = document.createElement('div');
                yearSection.className = 'year-section';
                yearSection.style.animationDelay = `${index * 0.1}s`;

                const yearTitle = document.createElement('h2');
                yearTitle.className = 'year-title';
                yearTitle.textContent = year;
                yearSection.appendChild(yearTitle);

                const grid = document.createElement('div');
                grid.className = 'books-grid';

                grouped[year].forEach((book, bookIndex) => {
                    const card = createBookCard(book, index);
                    grid.appendChild(card);
                });

                yearSection.appendChild(grid);
                container.appendChild(yearSection);
            });

            // Update total count
            document.getElementById('totalBooks').textContent = books.length;
        }

        function createBookCard(book, index) {
            const card = document.createElement('div');
            card.className = 'book-card';
            card.style.animationDelay = `${index * 0.05}s`;
            card.onclick = () => openModal(book);

            const cover = document.createElement('div');
            cover.className = 'book-cover';

            if (book.cover) {
                const img = document.createElement('img');
                img.src = book.cover;
                img.alt = book.title;
                cover.appendChild(img);
            } else {
                cover.innerHTML = `
                    <div class="placeholder">
                        <div class="icon">📚</div>
                        <div class="title">${book.title}</div>
                    </div>
                `;
            }

            const info = document.createElement('div');
            info.className = 'book-info';

            const title = document.createElement('h3');
            title.className = 'book-title';
            title.textContent = book.title;

            const titleEn = document.createElement('p');
            titleEn.className = 'book-title-en';
            titleEn.textContent = book.titleEn;

            const description = document.createElement('p');
            description.className = 'book-description';
            description.textContent = book.description;

            const meta = document.createElement('div');
            meta.className = 'book-meta';

            const category = document.createElement('span');
            category.className = 'book-category';
            category.textContent = book.category;

            meta.appendChild(category);
            info.appendChild(title);
            info.appendChild(titleEn);
            info.appendChild(description);
            info.appendChild(meta);

            card.appendChild(cover);
            card.appendChild(info);

            return card;
        }

        function openModal(book) {
            const modal = document.getElementById('bookModal');
            const cover = document.getElementById('modalCover');
            const title = document.getElementById('modalTitle');
            const titleEn = document.getElementById('modalTitleEn');
            const tags = document.getElementById('modalTags');
            const description = document.getElementById('modalDescription');
            const notes = document.getElementById('modalNotes');
            const notesContent = document.getElementById('modalNotesContent');

            if (book.cover) {
                cover.innerHTML = `<img src="${book.cover}" alt="${book.title}">`;
            } else {
                cover.innerHTML = `
                    <div class="placeholder">
                        <div class="icon">📖</div>
                    </div>
                `;
            }

            title.textContent = book.title;
            titleEn.textContent = book.titleEn || '';
            titleEn.style.display = book.titleEn ? 'block' : 'none';

            tags.innerHTML = `
                <span class="modal-tag">${book.year}年</span>
                <span class="modal-tag">${book.category}</span>
            `;

            description.textContent = book.description;

            if (book.notes) {
                notes.style.display = 'block';
                notesContent.textContent = book.notes;
            } else {
                notes.style.display = 'none';
            }

            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            const modal = document.getElementById('bookModal');
            modal.classList.remove('active');
            document.body.style.overflow = '';
        }

        // Close modal on outside click
        document.getElementById('bookModal').addEventListener('click', (e) => {
            if (e.target.id === 'bookModal') closeModal();
        });

        // Close modal on escape
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        // Filter buttons
        const filterBtns = document.querySelectorAll('.filter-btn');
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                const filter = btn.dataset.filter;
                if (filter === 'all') {
                    renderBooks(booksData);
                } else {
                    const filtered = booksData.filter(book =>
                        book.category.includes(filter) || book.titleEn && book.titleEn.toLowerCase().includes(filter.toLowerCase())
                    );
                    renderBooks(filtered);
                }
            });
        });

        // Search
        const searchInput = document.getElementById('searchInput');
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            if (query.length < 2) {
                renderBooks(booksData);
                return;
            }

            const filtered = booksData.filter(book =>
                book.title.toLowerCase().includes(query) ||
                book.titleEn.toLowerCase().includes(query) ||
                book.description.toLowerCase().includes(query)
            );
            renderBooks(filtered);
        });

        // Initial render
        renderBooks(booksData);
    </script>
</body>
</html>
