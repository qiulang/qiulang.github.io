remote_theme: mmistakes/minimal-mistakes@4.27.3

plugins:
  - jekyll-remote-theme
  - jekyll-include-cache

# ---- Site settings ----
title: "Lang Qiu (邱朗)"
locale: "zh-CN"
url: "https://qiulang.github.io"
baseurl: ""

# ---- Left sidebar (author profile) ----
author:
  name: "Lang Qiu (邱朗)"
  avatar: "/favicon.ico"
  bio: "软件与 AI · 读书与写作"
  location: "Beijing, China"
  links:
    - label: "Stack Overflow"
      icon: "fab fa-fw fa-stack-overflow"
      url: "https://stackoverflow.com/users/301513/qiulang"
    - label: "History Stack Exchange"
      icon: "fas fa-fw fa-landmark"
      url: "https://history.stackexchange.com/users/53036/qiulang"

# ---- Apply layout + sidebar to every page (incl. index.md) ----
defaults:
  - scope:
      path: ""
    values:
      layout: single
      author_profile: true
      toc: false
